<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Painel do Salão — conectando a agenda</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #111014;
        color: #f5f1ea;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        color: #b9b4ac;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Conectando sua agenda…</h1>
      <p id="msg">Voltando para o painel do salão.</p>
    </main>
    <script>
      // Página intermediária do "Entrar com Google" do Painel do Salão.
      // O Google só devolve o login para endereços https; esta página repassa a resposta
      // para o painel na rede local do salão (endereço que veio no "state").
      (function () {
        var q = new URLSearchParams(location.search);
        var msg = document.getElementById('msg');
        var base = null;
        try {
          var raw = (q.get('state') || '').replace(/-/g, '+').replace(/_/g, '/');
          base = JSON.parse(atob(raw)).b;
        } catch (e) {}
        // Só redireciona para a rede local (evita ser usada para mandar gente para outros sites).
        var local = /^http:\/\/(localhost|127\.\d+\.\d+\.\d+|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|[a-z0-9-]+\.local)(:\d{1,5})?$/i;
        if (typeof base !== 'string' || !local.test(base)) {
          msg.textContent = 'Link inválido. Gere um novo QR code no Gerenciador do painel.';
          return;
        }
        var out = new URLSearchParams();
        ['code', 'state', 'error'].forEach(function (k) {
          if (q.get(k)) out.set(k, q.get(k));
        });
        location.replace(base + '/api/google/callback?' + out.toString());
      })();
    </script>
  </body>
</html>
